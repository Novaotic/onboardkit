services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose overrides point the app at the local OpenLDAP sidecar.
      APP_ENV: development
      LOG_LEVEL: DEBUG
      LDAP_HOST: ldap-server
      LDAP_DOMAIN: example.org
      LDAP_PORT: "389"
      LDAP_BASE_DN: dc=example,dc=org
      LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LDAP_BIND_PASSWORD: admin
      # Must match group DNs in ldap/bootstrap/50-onboardkit.ldif
      LDAP_USERS_GROUP: cn=Portal Users,ou=groups,dc=example,dc=org
      LDAP_ADMIN_GROUP: cn=Portal Admin,ou=groups,dc=example,dc=org
    depends_on:
      ldap-server:
        condition: service_healthy
      ldap-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ldap-server:
    image: osixia/openldap:1.5.0
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: OnboardKit Test
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
      # Plain LDAP on 389 — matches the app's non-TLS bind for local testing.
      LDAP_TLS: "false"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    healthcheck:
      test:
        [
          "CMD",
          "ldapsearch",
          "-x",
          "-H",
          "ldap://127.0.0.1:389",
          "-b",
          "dc=example,dc=org",
          "-D",
          "cn=admin,dc=example,dc=org",
          "-w",
          "admin",
          "-LLL",
          "-s",
          "base",
          "(objectClass=*)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # osixia bootstrap bind-mounts break on Windows (sed -i / rm on the mount).
  # Seed after slapd is healthy instead.
  ldap-seed:
    image: osixia/openldap:1.5.0
    depends_on:
      ldap-server:
        condition: service_healthy
    volumes:
      - ./ldap/bootstrap/50-onboardkit.ldif:/seed.ldif:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if ldapsearch -x -H ldap://ldap-server:389 \
            -D "cn=admin,dc=example,dc=org" -w admin \
            -b "ou=users,dc=example,dc=org" -s base >/dev/null 2>&1; then
          echo "LDAP seed already present — skipping"
          exit 0
        fi
        # Strip Windows CRLF if the host checkout used CRLF line endings
        sed 's/\r$//' /seed.ldif > /tmp/seed.ldif
        ldapadd -x -H ldap://ldap-server:389 \
          -D "cn=admin,dc=example,dc=org" -w admin \
          -f /tmp/seed.ldif
        echo "LDAP seed applied"
    restart: "no"

volumes:
  ldap-data:
  ldap-config:
